<div
  class="field"
  [class.focused]="focused"
  [class.has-value]="value !== null"
  [class.disabled]="disabled"
  [class.error]="errorMessage"
  [class.align-center]="align === 'center'">
  <input
    [id]="inputId"
    [value]="value"
    [matTimepicker]="picker"
    [disabled]="disabled"
    [attr.aria-invalid]="errorMessage ? true : null"
    [attr.aria-describedby]="errorMessage ? inputId + '-error' : null"
    (valueChange)="onTimeChange($event)"
    (focus)="onFocus()"
    (blur)="onBlur()" />
  <label [for]="inputId">
    {{ label }}
    @if (required) {
      <span class="required"> *</span>
    }
  </label>
  <mat-timepicker
    #picker
    [interval]="interval"
    panelClass="mat-accent"></mat-timepicker>
  <div class="line"></div>
  @if (errorMessage) {
    <div class="err" [id]="inputId + '-error'">
      {{ errorMessage }}
    </div>
  }
</div>
