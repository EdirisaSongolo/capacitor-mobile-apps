<div
  [ngClass]="{
    'mobile-business-contacts': device === deviceTypes.mobile,
    'desktop-business-contacts': device === deviceTypes.desktop,
  }">
  <form
    [formGroup]="businessContactsForm"
    (ngSubmit)="submitBusinessContactsForm()">
    <Tsk-input-component
      [label]="
        'user-profile-dashboard.details.user-details-form.email-address'
          | translate
      "
      formControlName="emailAddress">
    </Tsk-input-component>

    <Tsk-input-component
      type="tel"
      mask="(000) 000-0000"
      [label]="
        'profile-revenue.revenue-account.business-details.phone-number'
          | translate
      "
      formControlName="phoneNumber">
    </Tsk-input-component>

    <button mat-raised-button class="raised-button" type="submit">
      {{ 'button-label.enter' | translate }}
    </button>
  </form>
</div>
