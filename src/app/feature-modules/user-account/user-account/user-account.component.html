<div
  [ngClass]="{
    'mobile-user-account': device === deviceTypes.mobile,
    'desktop-user-account': device === deviceTypes.desktop,
  }">
  <Tsk-user-account-header
    (headerAction)="processHeaderAction($event)"></Tsk-user-account-header>

  <div class="display-controls">
    @for (control of displayControls; track control) {
      <div>
        <button
          class="icon-button"
          mat-icon-button
          (click)="updateDisplayPanel(control)">
          <mat-icon
            [fontIcon]="control.icon"
            class="material-symbols-outlined"></mat-icon>
        </button>
      </div>
    }
  </div>

  <div class="account-profile-display">
    <router-outlet></router-outlet>
  </div>
</div>
