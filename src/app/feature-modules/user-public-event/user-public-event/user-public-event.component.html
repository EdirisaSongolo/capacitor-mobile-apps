<div
  [ngClass]="{
    'mobile-user-public-events': device === deviceTypes.mobile,
    'desktop-user-public-events': device === deviceTypes.desktop,
  }">
  <div class="profile-image" [style.background]="profileImage"></div>
  <div class="event-name">{{ eventName }}</div>
  <div class="event-location">
    <div class="location-components venue-details">
      <Tsk-venue-plac
        class="profile-reference"
        [venueToken]="venueToken"></Tsk-venue-plac>
    </div>
    <div class="location-components event-details">
      <p>{{ eventDate }}</p>
      <p>{{ eventTime }}</p>
      <p>{{ venueAddress }}</p>
    </div>
  </div>

  <div class="display-controls">
    @for (control of userEventControls; track control) {
      <button
        class="control"
        mat-icon-button
        (click)="switchUserEventsDisplay(control)">
        <mat-icon
          [fontIcon]="control.icon"
          class="material-symbols-outlined"></mat-icon>
      </button>
    }
  </div>

  <div class="public-event-display">
    <router-outlet></router-outlet>
  </div>
</div>
