<div
  [ngClass]="{
    'mobile-user-profile-dashboard': device === deviceTypes.mobile,
    'desktop-user-profile-dashboard': device === deviceTypes.desktop,
  }">
  <form
    class="password-form"
    [formGroup]="userPasswordForm"
    (ngSubmit)="updateUserPassword()">
    <Tsk-input-component
      type="password"
      [label]="
        'user-profile-dashboard.password.password-form.current-password'
          | translate
      "
      formControlName="currentPassword">
    </Tsk-input-component>

    <Tsk-input-component
      type="password"
      [label]="
        'user-profile-dashboard.password.password-form.new-password' | translate
      "
      formControlName="newPassword">
    </Tsk-input-component>

    <Tsk-input-component
      type="password"
      [label]="
        'user-profile-dashboard.password.password-form.confirm-password'
          | translate
      "
      formControlName="confirmPassword">
    </Tsk-input-component>

    <button mat-raised-button class="raised-button" type="submit">
      {{ 'button-label.enter' | translate }}
    </button>
  </form>
</div>
