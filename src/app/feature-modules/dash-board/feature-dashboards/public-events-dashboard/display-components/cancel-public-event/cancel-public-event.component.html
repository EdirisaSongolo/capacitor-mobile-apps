<div
  [ngClass]="{
    'mobile-public-event-dashboard': device === deviceTypes.mobile,
    'desktop-public-event-dashboard': device === deviceTypes.desktop,
  }">
  <div class="cancel-event">
    <p>{{ 'public-event-dashboard.cancel-event-outline' | translate }}</p>
    <button
      mat-raised-button
      class="raised-button"
      (click)="displayConfirmationDialog()">
      {{ 'button-label.cancel' | translate }}
    </button>
  </div>

  @if (confirmationDialog) {
    <Tsk-confirmation-dialog
      [confirmationMessage]="cancelConfirmation"
      (dialogAction)="cancelDialogAction($event)"></Tsk-confirmation-dialog>
  }
</div>
