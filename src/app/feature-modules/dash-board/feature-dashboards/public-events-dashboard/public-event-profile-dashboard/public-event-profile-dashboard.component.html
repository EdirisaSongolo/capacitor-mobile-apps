<div
  [ngClass]="{
    'mobile-public-event-dashboard': device === deviceTypes.mobile,
    'desktop-public-event-dashboard': device === deviceTypes.desktop,
  }">
  <div class="public-event">{{ publicEventName$ | async }}</div>

  <div class="controls">
    @for (control of publicEventControls; track control) {
      <button
        class="icon-button"
        mat-icon-button
        (click)="updateDisplayPanel(control.route)">
        <mat-icon
          [fontIcon]="control.icon"
          class="material-symbols-outlined"></mat-icon>
      </button>
    }
  </div>

  <div class="dashboard-display">
    <router-outlet></router-outlet>
  </div>
</div>
