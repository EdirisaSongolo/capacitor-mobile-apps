<div
  [ngClass]="{
    'mobile-credentials-recovery': device === deviceTypes.mobile,
    'desktop-credentials-recovery': device === deviceTypes.desktop,
  }">
  <form
    [ngClass]="{
      'mobile-email-form': device === deviceTypes.mobile,
      'desktop-email-form': device === deviceTypes.desktop,
    }"
    [formGroup]="userEmailForm"
    (ngSubmit)="createTemporaryPassword()">
    <Tsk-input-component
      [required]="true"
      [label]="'auth.credentials-recovery.email-form' | translate"
      formControlName="userEmail"
      [errorMessage]="
        userEmailForm.controls['userEmail']?.touched &&
        userEmailForm.controls['userEmail'].errors?.['required']
          ? ('auth.credentials-recovery.form-errors.required' | translate)
          : userEmailForm.controls['userEmail']?.touched &&
              userEmailForm.controls['userEmail'].errors?.['email']
            ? ('auth.credentials-recovery.form-errors.invalid-email-address'
              | translate)
            : null
      ">
    </Tsk-input-component>

    <button
      mat-raised-button
      class="raised-button"
      type="submit"
      [disabled]="userEmailForm.invalid">
      {{ 'button-label.enter' | translate }}
    </button>
  </form>

  @if (temporaryPasswordCreated) {
    <form
      [ngClass]="{
        'mobile-password-form': device === deviceTypes.mobile,
        'desktop-password-form': device === deviceTypes.desktop,
      }"
      [formGroup]="userPasswordForm"
      (ngSubmit)="resetUserPassword()">
      <Tsk-input-component
        [required]="true"
        type="password"
        [label]="
          'auth.credentials-recovery.password-form.temporary-password'
            | translate
        "
        formControlName="temporaryPassword"
        [errorMessage]="
          userPasswordForm.controls['temporaryPassword']?.touched &&
          userPasswordForm.controls['temporaryPassword'].errors?.['required']
            ? ('auth.credentials-recovery.form-errors.required' | translate)
            : null
        ">
      </Tsk-input-component>

      <Tsk-input-component
        [required]="true"
        type="password"
        [label]="
          'auth.credentials-recovery.password-form.new-password' | translate
        "
        formControlName="newPassword"
        [errorMessage]="
          userPasswordForm.controls['newPassword']?.touched &&
          userPasswordForm.controls['newPassword'].errors?.['required']
            ? ('auth.credentials-recovery.form-errors.required' | translate)
            : null
        ">
      </Tsk-input-component>

      <Tsk-input-component
        [required]="true"
        type="password"
        [label]="
          'auth.credentials-recovery.password-form.confirm-password' | translate
        "
        formControlName="confirmPassword"
        [errorMessage]="
          userPasswordForm.controls['confirmPassword']?.touched &&
          userPasswordForm.controls['confirmPassword'].errors?.['required']
            ? ('auth.credentials-recovery.form-errors.required' | translate)
            : null
        ">
      </Tsk-input-component>
      <button
        mat-raised-button
        class="raised-button"
        type="submit"
        [disabled]="userPasswordForm.invalid">
        {{ 'button-label.enter' | translate }}
      </button>
    </form>
  }
</div>
