<div
  [ngClass]="{
    'mobile-private-event-name': device === deviceTypes.mobile,
    'desktop-private-event-name': device === deviceTypes.desktop,
  }">
  <Tsk-private-event-plac
    [privateEventToken]="privateEventToken"
    (placAction)="uploadProfileImage()"></Tsk-private-event-plac>

  <form class="event-name-entry" [formGroup]="nameForm">
    <Tsk-input-component
      [label]="'create-event.enter-name' | translate"
      [align]="'center'"
      formControlName="eventName">
    </Tsk-input-component>
  </form>
</div>
